name: Release

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 22
                cache: "npm"

            - run: npm ci
            - run: npm run test
            - run: npm run build

            - name: Package dist
              run: cd dist && zip -r ../calculator-${{ github.ref_name }}.zip .

            - name: Create GitHub Release
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                gh release create ${{ github.ref_name }} \
                    calculator-${{ github.ref_name }}.zip \
                    --title "Release ${{ github.ref_name }}" \
                    --generate-notes