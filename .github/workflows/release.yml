name: Release

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 22
                cache: "npm"

            - run: npm ci
            - run: npm run test
            - run: npm run build

            - name: Package dist
              run: cd dist && zip -r ../calculator-${{ github.ref_name }}.zip .

            - name: Create GitHub Release
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                gh release create ${{ github.ref_name }} \
                    calculator-${{ github.ref_name }}.zip \
                    --title "Release ${{ github.ref_name }}" \
                    --generate-notes

    deploy-production:
        needs: release
        runs-on: ubuntu-latest
        
        permissions:
            contents: read
            id-token: write
            pages: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 22
            
            - run: npm run build
            - name: Add version info
              run: echo "${{ github.ref_name }} (${{ github.sha }})" > dist/version.txt

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                path: ./dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4